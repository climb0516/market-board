<!DOCTYPE html>
<html lang="zh-CN">
<!-- Created by 青云 on 2026/10/21. -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>Market Board · 市场看板</title>
  <meta name="description" content="A 股、港股、美股及全球指数实时行情，重点股票与自选，板块榜单；汇率、油价金价">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08090d;
      --panel: rgba(20,22,30,0.76);
      --panel-solid: #12141b;
      --hover: rgba(255,255,255,0.045);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.14);
      --text-1: #eef0f6;
      --text-2: #a0a6b8;
      --text-3: #676d80;
      --accent: #818cf8;
      --accent-2: #38bdf8;
      --grad: linear-gradient(120deg, #a78bfa 0%, #818cf8 45%, #38bdf8 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(129,140,248,0.14);
      --glow-2: rgba(56,189,248,0.08);
      --up: #f2555a;      /* 国内习惯：涨红跌绿 */
      --down: #22c08a;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
      --input-bg: rgba(255,255,255,0.05);
      --star: #fbbf24;
    }
    :root[data-theme="light"] {
      --bg: #f6f7fb;
      --panel: rgba(255,255,255,0.9);
      --panel-solid: #ffffff;
      --hover: rgba(20,30,70,0.04);
      --line: rgba(20,30,70,0.08);
      --line-2: rgba(20,30,70,0.16);
      --text-1: #141827;
      --text-2: #4c5368;
      --text-3: #8b91a3;
      --accent: #4f46e5;
      --accent-2: #0284c7;
      --grid-dot: rgba(20,30,70,0.06);
      --glow-1: rgba(79,70,229,0.08);
      --glow-2: rgba(2,132,199,0.06);
      --up: #dc2626;
      --down: #059669;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(20,30,70,0.07);
      --input-bg: rgba(20,30,70,0.035);
      --star: #d97706;
    }

    body {
      background: var(--bg); color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 420px at 10% -10%, var(--glow-1), transparent 70%),
        radial-gradient(800px 400px at 92% -5%, var(--glow-2), transparent 70%),
        radial-gradient(var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input, textarea { font: inherit; color: var(--text-1); }
    .num { font-variant-numeric: tabular-nums; }
    .up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--text-3); }

    /* ── 顶栏 ── */
    .topbar { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
      background: color-mix(in srgb, var(--bg) 74%, transparent); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1320px; margin: 0 auto; padding: 11px 20px; display: flex; align-items: center; gap: 14px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; font-size: 16px; }
    .logo small { font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 2px; }
    .tabs { display: flex; gap: 3px; background: var(--hover); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
    .tab { padding: 6px 13px; border-radius: 8px; color: var(--text-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
    .tab:hover { color: var(--text-1); }
    .tab.active { background: var(--panel-solid); color: var(--text-1); box-shadow: 0 0 0 1px var(--line-2); }
    .spacer { flex: 1; }
    .status { font-size: 12px; color: var(--text-3); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--down); box-shadow: 0 0 0 3px color-mix(in srgb, var(--down) 25%, transparent); }
    .live-dot.stale { background: var(--star); box-shadow: 0 0 0 3px color-mix(in srgb, var(--star) 25%, transparent); }
    .live-dot.idle { background: var(--text-3); box-shadow: none; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 搜索 ── */
    .search { position: relative; width: 260px; }
    .search-box { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--input-bg); border: 1px solid var(--line); }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box svg { color: var(--text-3); flex-shrink: 0; }
    .search-box input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 13px; }
    .kbd { font-size: 11px; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; line-height: 17px; }
    .search-pop { position: absolute; top: 40px; right: 0; width: 380px; max-width: calc(100vw - 32px); background: var(--panel-solid); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; display: none; z-index: 50; max-height: 70vh; overflow-y: auto; }
    .search-pop.open { display: block; }
    .sr { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .sr.hl, .sr:hover { background: var(--hover); }
    .sr .nm { flex: 1; min-width: 0; }
    .sr .nm b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sr .nm small { color: var(--text-3); font-size: 11.5px; }
    .sr .px { text-align: right; font-size: 12.5px; white-space: nowrap; }
    .sr .px small { display: block; font-size: 11.5px; }
    .sr-tip { font-size: 12px; color: var(--text-3); padding: 10px; }
    .mk { display: inline-block; font-size: 10.5px; font-weight: 700; line-height: 16px; padding: 0 5px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
    .mk.US { background: color-mix(in srgb, #60a5fa 22%, transparent); color: #60a5fa; }
    .mk.HK { background: color-mix(in srgb, #f472b6 22%, transparent); color: #f472b6; }
    .mk.CN { background: color-mix(in srgb, #f87171 22%, transparent); color: #f87171; }
    .star { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--text-3); font-size: 16px; flex-shrink: 0; }
    .star:hover { background: var(--hover); color: var(--text-1); }
    .star.on { color: var(--star); }

    /* ── 布局 ── */
    .wrap { max-width: 1320px; margin: 0 auto; padding: 22px 20px 60px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 22px; align-items: start; }
    .aside { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }
    .widget { padding: 16px; }
    .widget h3 { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .widget h3 small { font-weight: 500; color: var(--text-3); font-size: 11.5px; }
    .hero { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
    .hero h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { color: var(--text-2); margin-top: 4px; font-size: 13px; }
    .section-title { font-size: 15px; font-weight: 700; margin: 24px 0 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .section-title:first-child { margin-top: 0; }
    .section-title small { color: var(--text-3); font-weight: 500; font-size: 12px; }
    .note { font-size: 12px; color: var(--text-3); line-height: 1.7; margin-top: 12px; }
    .seg { display: inline-flex; background: var(--hover); border: 1px solid var(--line); border-radius: 9px; padding: 2px; flex-shrink: 0; }
    .seg button { padding: 4px 11px; border-radius: 7px; font-size: 12.5px; color: var(--text-2); font-weight: 500; white-space: nowrap; }
    .seg button.active { background: var(--panel-solid); color: var(--text-1); box-shadow: 0 0 0 1px var(--line-2); }
    .btn { padding: 6px 12px; border-radius: 9px; border: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); font-weight: 500; white-space: nowrap; }
    .btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .empty { padding: 36px 16px; text-align: center; color: var(--text-3); font-size: 13px; }

    /* ── 市场状态条 ── */
    .mstat { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .ms { display: flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; white-space: nowrap; }
    .ms i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
    .ms.open i { background: var(--down); box-shadow: 0 0 0 3px color-mix(in srgb, var(--down) 25%, transparent); }
    .ms.pre i { background: var(--star); }
    .ms small { color: var(--text-3); }

    /* ── 指数卡片 ── */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 12px; }
    .card { padding: 13px 14px 10px; cursor: pointer; transition: box-shadow .2s; min-width: 0; position: relative; }
    .card { transition: transform .2s, box-shadow .2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--line-2), 0 14px 34px rgba(0,0,0,0.22); }
    .card.t-up { background: linear-gradient(180deg, color-mix(in srgb, var(--up) 7%, var(--panel)), var(--panel) 70%); }
    .card.t-down { background: linear-gradient(180deg, color-mix(in srgb, var(--down) 7%, var(--panel)), var(--panel) 70%); }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .card-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-st { font-size: 11px; color: var(--text-3); white-space: nowrap; }
    .card-px { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; line-height: 1.3; }
    .card-chg { font-size: 12.5px; font-weight: 600; display: flex; gap: 10px; }
    .spark { width: 100%; height: 40px; display: block; margin-top: 6px; }
    .card.flash-up { animation: fu 1s; } .card.flash-down { animation: fd 1s; }
    @keyframes fu { from { box-shadow: 0 0 0 1px var(--up); } }
    @keyframes fd { from { box-shadow: 0 0 0 1px var(--down); } }

    /* ── 宽度条 ── */
    .breadth { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--hover); margin: 8px 0 6px; }
    .breadth span { display: block; height: 100%; }
    .mini-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; padding: 4px 0; gap: 8px; }
    .mini-row > span:first-child { color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-row.click { cursor: pointer; border-radius: 6px; }
    .mini-row.click:hover { background: var(--hover); }
    .status-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; gap: 8px; color: var(--text-2); }
    .ok { color: var(--down); } .bad { color: var(--up); }

    /* ── 表格 ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: right; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 11.5px; color: var(--text-3); font-weight: 600; user-select: none; }
    th.sort { cursor: pointer; }
    th.sort:hover { color: var(--text-1); }
    th.sorted { color: var(--text-1); }
    th:first-child, td:first-child { text-align: left; }
    tr:last-child td { border-bottom: 0; }
    tbody tr.click { cursor: pointer; }
    tbody tr:hover td { background: var(--hover); }
    td .nm b { font-weight: 600; display: block; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    td .nm small { color: var(--text-3); font-size: 11.5px; }
    td.ops { width: 1%; padding: 4px 8px; }
    td.ops .row-ops { display: flex; gap: 2px; justify-content: flex-end; }
    .pct-pill { display: inline-block; min-width: 68px; text-align: right; padding: 2px 7px; border-radius: 6px; font-weight: 700; }
    .pct-pill.up { background: color-mix(in srgb, var(--up) 14%, transparent); }
    .pct-pill.down { background: color-mix(in srgb, var(--down) 14%, transparent); }

    /* ── 自选工具条 / 导入 ── */
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar .group { display: flex; gap: 6px; flex-wrap: wrap; }
    .io { padding: 12px; margin-bottom: 12px; display: grid; gap: 8px; }
    .io textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--input-bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; outline: 0; }
    .io textarea:focus { border-color: var(--accent); }

    /* ── 板块热力图 ── */
    .heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); grid-auto-rows: 66px; grid-auto-flow: dense; gap: 6px; padding: 12px; }
    .ht { border-radius: 9px; padding: 8px 10px; min-width: 0; color: var(--text-1); overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
    .ht.l { grid-column: span 2; }
    .ht.xl { grid-column: span 2; grid-row: span 2; padding: 14px; }
    .ht.xl b { font-size: 17px; } .ht.xl span { font-size: 22px; } .ht.xl small { font-size: 12px; margin-top: 2px; }
    .ht.l b { font-size: 14px; } .ht.l span { font-size: 16px; }
    .ht b { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ht span { font-size: 13px; font-weight: 800; }
    .ht small { display: block; font-size: 10.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }

    /* ── 股票 logo：图片盖在首字头像上，加载失败时露出首字 ── */
    .logo-av { position: relative; width: 30px; height: 30px; border-radius: 9px; overflow: hidden; flex-shrink: 0; display: inline-grid; place-items: center;
      background: hsl(var(--h) 42% 46%); color: #fff; box-shadow: 0 0 0 1px var(--line); }
    .logo-av b { font-size: 13px; font-weight: 700; }
    .logo-av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .logo-av.sm { width: 20px; height: 20px; border-radius: 6px; } .logo-av.sm b { font-size: 10px; }
    .logo-av.lg { width: 38px; height: 38px; border-radius: 11px; } .logo-av.lg b { font-size: 15px; }
    .logo-av.xl { width: 48px; height: 48px; border-radius: 13px; } .logo-av.xl b { font-size: 19px; }
    .nm-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mr-name { display: flex; align-items: center; gap: 8px; }
    .nm small .mk, .mv-t small .mk, .sheet-head h2 small .mk { margin-right: 5px; }

    /* ── 骨架占位 ── */
    .skel { background: linear-gradient(90deg, var(--hover) 25%, var(--line-2) 50%, var(--hover) 75%); background-size: 200% 100%; animation: sk 1.4s ease-in-out infinite; }
    .spark.skel { height: 40px; border-radius: 6px; margin-top: 6px; } .spark.skel.big { height: 64px; }
    @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* ── 三大指数 ── */
    .hero-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
    .hero-card { padding: 16px 18px 12px; cursor: pointer; position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s; }
    .hero-card::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .9;
      background: radial-gradient(120% 90% at 100% 0%, var(--tint, transparent), transparent 60%); }
    .hero-card.t-up { --tint: color-mix(in srgb, var(--up) 16%, transparent); }
    .hero-card.t-down { --tint: color-mix(in srgb, var(--down) 16%, transparent); }
    .hero-card:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--line-2), 0 18px 40px rgba(0,0,0,0.25); }
    .hc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: relative; }
    .hc-name { font-weight: 700; font-size: 14px; }
    .hero-card .ms { padding: 2px 9px; font-size: 11.5px; background: transparent; }
    .hc-px { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; margin-top: 6px; line-height: 1.2; position: relative; }
    .hc-chg { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; margin-top: 2px; position: relative; }
    .spark.big { height: 64px; margin-top: 10px; }

    /* ── 今日异动 ── */
    .movers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .mover { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; gap: 8px 10px; padding: 12px; cursor: pointer; transition: transform .2s; }
    .mover:hover { transform: translateY(-2px); }
    .mover .logo-av { grid-row: 1; }
    .mv-t { min-width: 0; }
    .mv-t b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mv-t small { font-size: 11px; color: var(--text-3); }
    .mv-p { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
    .mv-p b { font-size: 15px; font-weight: 700; }
    .mover.t-up { background: linear-gradient(160deg, color-mix(in srgb, var(--up) 9%, var(--panel)), var(--panel) 65%); }
    .mover.t-down { background: linear-gradient(160deg, color-mix(in srgb, var(--down) 9%, var(--panel)), var(--panel) 65%); }

    /* ── 重点股票：卡片视图 ── */
    .hero-tools { display: flex; gap: 8px; flex-wrap: wrap; }
    .stock-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .scard { padding: 14px 14px 10px; cursor: pointer; min-width: 0; transition: transform .2s, box-shadow .2s; }
    .scard:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--line-2), 0 14px 34px rgba(0,0,0,0.22); }
    .sc-head { display: flex; align-items: center; gap: 10px; }
    .sc-head .nm { flex: 1; min-width: 0; }
    .sc-head .nm b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sc-head .nm small { color: var(--text-3); font-size: 11.5px; }
    .sc-px { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .sc-px b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .sc-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-3); margin-top: 6px; }

    /* ── 嵌入模块 ── */
    .frame { width: 100%; border: 0; display: block; min-height: 600px; background: transparent; color-scheme: normal; }

    /* ── 详情：半屏抽屉（电脑右侧滑出，手机底部升起） ── */
    /* 电脑上遮罩不拦截点击：抽屉开着也能点左边页面的其他股票直接切换 */
    .modal { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(0,0,0,.28); pointer-events: none; }
    .modal.open { display: block; }
    .sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(520px, 50vw, 720px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; pointer-events: auto;
      background: var(--panel-solid); border-radius: 18px; box-shadow: 0 0 0 1px var(--line-2), 0 24px 60px rgba(0,0,0,.45); animation: drawer-in .26s ease-out; }
    @keyframes drawer-in { from { transform: translateX(40px); opacity: 0; } }
    .sheet-top { flex-shrink: 0; padding: 16px 20px 0; border-bottom: 1px solid var(--line); background: var(--panel-solid); touch-action: none; }
    .sheet.t-up .sheet-top { background: linear-gradient(180deg, color-mix(in srgb, var(--up) 13%, var(--panel-solid)), var(--panel-solid)); }
    .sheet.t-down .sheet-top { background: linear-gradient(180deg, color-mix(in srgb, var(--down) 13%, var(--panel-solid)), var(--panel-solid)); }
    .grabber { display: none; width: 38px; height: 5px; border-radius: 999px; background: var(--line-2); margin: -6px auto 10px; }
    .sheet-head { display: flex; align-items: flex-start; gap: 14px; }
    .sheet-head .t { flex: 1; min-width: 0; }
    .sheet-head h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sheet-head h2 small { font-size: 12.5px; color: var(--text-3); font-weight: 500; margin-left: 6px; }
    .sheet-px { display: flex; align-items: baseline; gap: 12px; margin-top: 2px; flex-wrap: wrap; }
    .sheet-px b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .sheet-px span { font-weight: 700; }
    .sheet-nav { display: flex; gap: 22px; margin-top: 12px; }
    .sheet-nav button { padding: 8px 0 10px; font-size: 13.5px; font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .sheet-nav button:hover { color: var(--text-1); }
    .sheet-nav button.active { color: var(--text-1); border-bottom-color: var(--accent); }
    .sheet-body { flex: 1; overflow-y: auto; padding: 4px 20px 24px; position: relative; overscroll-behavior: contain; }
    .dsec { padding-top: 16px; }
    .dsec + .dsec { margin-top: 10px; border-top: 1px solid var(--line); }
    .dsec h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .dsec h3 small { font-size: 12px; color: var(--text-3); font-weight: 500; }
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 16px; margin: 4px 0 14px; }
    .stats div { font-size: 12px; color: var(--text-3); display: flex; justify-content: space-between; gap: 6px; }
    .stats b { color: var(--text-1); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 公司简介 */
    .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .fact { padding: 9px 11px; border-radius: 10px; background: var(--hover); border: 1px solid var(--line); min-width: 0; }
    .fact span { display: block; font-size: 11.5px; color: var(--text-3); }
    .fact b { display: block; font-size: 13px; font-weight: 600; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fact a { color: var(--accent); }
    .fact.wide { grid-column: 1 / -1; }
    .prose { font-size: 13.5px; line-height: 1.8; color: var(--text-2); }
    .prose.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .prose-h { font-size: 12.5px; font-weight: 700; color: var(--text-1); margin: 12px 0 4px; }
    .more-btn { font-size: 12.5px; color: var(--accent); font-weight: 600; margin-top: 4px; }

    /* 相关资讯 */
    .news { display: flex; flex-direction: column; }
    .nw { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .nw:last-child { border-bottom: 0; }
    .nw:hover .nw-t { color: var(--accent); }
    .nw-x { flex: 1; min-width: 0; }
    .nw-t { font-size: 14px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nw-s { font-size: 12.5px; color: var(--text-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nw-m { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }
    .nw-img { width: 96px; height: 64px; border-radius: 9px; object-fit: cover; flex-shrink: 0; background: var(--hover); }
    .news-more { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--accent); }
    .skel-line { height: 14px; border-radius: 6px; margin: 10px 0; }
    .kchart { position: relative; }
    .kchart svg { width: 100%; height: 300px; display: block; }
    .tip { position: absolute; pointer-events: none; background: var(--panel-solid); box-shadow: var(--shadow); border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }

    @media (max-width: 1080px) {
      .movers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .layout { grid-template-columns: minmax(0, 1fr); }
      .aside { position: static; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
      .search { width: 200px; }
    }
    @media (max-width: 760px) {
      .topbar-inner { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
      .logo small, .status-text { display: none; }
      .search { order: 3; width: 100%; }
      .search-pop { left: 0; right: auto; width: 100%; max-width: none; }
      .kbd { display: none; }
      .tabs { order: 4; width: 100%; overflow-x: auto; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { flex: 1; text-align: center; padding: 6px 8px; }
      .wrap { padding: 16px 16px 50px; }
      .hero h1 { font-size: 20px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .card-px { font-size: 18px; }
      .card-chg { gap: 6px; font-size: 11.5px; }
      .two { grid-template-columns: minmax(0, 1fr); }
      .hero-row, .movers { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
      .hero-row::-webkit-scrollbar, .movers::-webkit-scrollbar { display: none; }
      .mstat { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
      .mstat::-webkit-scrollbar { display: none; }
      .hero-card { flex: 0 0 82%; scroll-snap-align: start; }
      .mover { flex: 0 0 46%; scroll-snap-align: start; }
      .hc-px { font-size: 26px; }
      .stock-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .sc-px b { font-size: 17px; }
      .sc-px { flex-direction: column; align-items: flex-start; gap: 4px; }
      .heat { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 58px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kchart svg { height: 240px; }
      /* 手机：底部半屏，可拖到全屏；遮罩可点关闭 */
      .modal { pointer-events: auto; }
      .sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; height: 55vh; border-radius: 18px 18px 0 0;
        animation: sheet-up .28s ease-out; transition: height .25s ease, transform .25s ease; }
      .sheet.full { height: calc(100vh - 40px); }
      .sheet.dragging { transition: none; }
      @keyframes sheet-up { from { transform: translateY(40%); opacity: .4; } }
      .grabber { display: block; }
      .sheet-top { padding: 16px 16px 0; }
      .sheet-body { padding: 4px 16px 28px; }
      .sheet-px b { font-size: 24px; }
      .nw-img { width: 84px; height: 58px; }
      th, td { padding: 8px; }
      .hide-m { display: none; }
      td .nm b { max-width: 150px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#overview"><span class="logo-mark">📊</span>Market Board<small>市场看板</small></a>
      <nav class="tabs" id="tabs">
        <button class="tab" data-tab="overview">总览</button>
        <button class="tab" data-tab="stocks">重点股票</button>
        <button class="tab" data-tab="sectors">板块榜单</button>
        <button class="tab" data-tab="fx">汇率</button>
        <button class="tab" data-tab="oilgold">油价金价</button>
      </nav>
      <div class="spacer"></div>
      <div class="search" id="search">
        <label class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="搜股票：名称 / 代码 / 拼音首字母" autocomplete="off" spellcheck="false">
          <span class="kbd">/</span>
        </label>
        <div class="search-pop" id="search-pop"></div>
      </div>
      <span class="status"><span class="live-dot idle" id="live-dot"></span><span class="status-text" id="status">加载中…</span></span>
      <button class="icon-btn" id="refresh" title="立即刷新">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <a class="icon-btn" href="https://github.com/climb0516/market-board/actions/workflows/scrape.yml" target="_blank" rel="noopener" title="立即抓取快照（在 GitHub Actions 点 Run workflow）">⚡</a>
      <button class="icon-btn" id="theme" title="切换主题">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="wrap">
    <section id="view-overview" class="view"></section>
    <section id="view-stocks" class="view" hidden></section>
    <section id="view-sectors" class="view" hidden></section>
    <section id="view-fx" class="view" hidden></section>
    <section id="view-oilgold" class="view" hidden></section>
  </div>

  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

  <!-- 改了 app.js 记得改版本号，否则浏览器可能用缓存的旧文件 -->
  <script src="app.js?v=20261021-7"></script>
</body>
